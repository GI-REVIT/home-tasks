<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>משימות הבית</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">

    <section id="login-view" class="card" hidden>
      <h1>משימות הבית</h1>
      <form id="login-form" class="stack">
        <label>
          מייל
          <input type="email" id="email" required autocomplete="email">
        </label>
        <label>
          סיסמה
          <input type="password" id="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="primary">כניסה</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app-view" hidden>
      <header class="topbar">
        <h1>משימות הבית</h1>
        <button id="logout-btn" class="ghost">יציאה</button>
      </header>
      <p class="muted">המסכים של היום, השבוע, המשימות וההיסטוריה ייבנו בשלבים הבאים.</p>
    </section>

    <p id="config-warning" class="error" hidden>
      חסר חיבור לשרת. יש להזין את הפרטים בקובץ js/config.js (ראו README.md).
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
